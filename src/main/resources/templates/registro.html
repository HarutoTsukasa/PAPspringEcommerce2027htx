<!doctype html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Formulario visual de registro de Nova Market.">
  <title>Nova Market | Registro</title>
  <link rel="icon" type="image/jpeg" href="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=64&h=64&fit=crop&crop=center">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand bg-body border-bottom">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <span class="brand-mark">N</span>Nova Market
      </a>
      <div class="d-flex align-items-center gap-2">
        <a class="btn btn-link btn-sm" href="index.html">Volver a la tienda</a>
        <button class="btn btn-outline-primary btn-sm theme-toggle" id="themeToggle" type="button">
          <span id="themeIcon" aria-hidden="true">☾</span>
          <span id="themeLabel">Tema oscuro</span>
        </button>
      </div>
    </div>
  </nav>

  <main class="auth-section">
    <div class="container">
      <section class="auth-card shadow-sm p-4 p-md-5" aria-labelledby="registerTitle">
        <div class="text-center mb-4">
          <span class="auth-icon mb-3" aria-hidden="true">✦</span>
          <h1 class="h2 section-heading" id="registerTitle">Crear una cuenta</h1>
          <p class="text-body-secondary mb-0">Completa tus datos para registrarte en Nova Market.</p>
        </div>

        <!-- Formulario de presentación: no envía ni almacena información. -->
        <form>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label" for="firstName">Nombres</label>
              <input class="form-control" type="text" id="firstName" name="firstName" autocomplete="given-name" placeholder="Tus nombres">
            </div>
            <div class="col-md-6">
              <label class="form-label" for="lastName">Apellidos</label>
              <input class="form-control" type="text" id="lastName" name="lastName" autocomplete="family-name" placeholder="Tus apellidos">
            </div>
            <div class="col-12">
              <label class="form-label" for="registerEmail">Correo electrónico</label>
              <input class="form-control" type="email" id="registerEmail" name="email" autocomplete="email" placeholder="nombre@correo.com">
            </div>
            <div class="col-12">
              <label class="form-label" for="phone">Teléfono <span class="text-body-secondary fw-normal">(opcional)</span></label>
              <input class="form-control" type="tel" id="phone" name="phone" autocomplete="tel" placeholder="300 000 0000">
            </div>
            <div class="col-md-6">
              <label class="form-label" for="registerPassword">Contraseña</label>
              <input class="form-control" type="password" id="registerPassword" name="password" autocomplete="new-password" placeholder="Crea una contraseña">
            </div>
            <div class="col-md-6">
              <label class="form-label" for="confirmPassword">Confirmar contraseña</label>
              <input class="form-control" type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" placeholder="Repite la contraseña">
            </div>
            <div class="col-12 pt-1">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="terms">
                <label class="form-check-label small" for="terms">Acepto los términos y condiciones de ejemplo.</label>
              </div>
            </div>
            <div class="col-12 d-grid pt-2">
              <button class="btn btn-primary btn-lg" type="button">Crear cuenta</button>
            </div>
          </div>
        </form>

        <p class="text-center text-body-secondary small mt-4 mb-0">
          ¿Ya tienes una cuenta? <a href="login.html" class="fw-semibold">Inicia sesión</a>
        </p>
      </section>
    </div>
  </main>

  <footer class="site-footer py-3">
    <div class="container text-center small text-body-secondary">© 2026 Nova Market</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/theme.js"></script>
</body>
</html>
