<!doctype html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Formulario visual de inicio de sesión de Nova Market.">
  <title>Nova Market | Iniciar sesión</title>
  <link rel="icon" type="image/jpeg" href="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=64&h=64&fit=crop&crop=center">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand bg-body border-bottom">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <span class="brand-mark">N</span>Nova Market
      </a>
      <div class="d-flex align-items-center gap-2">
        <a class="btn btn-link btn-sm" href="index.html">Volver a la tienda</a>
        <button class="btn btn-outline-primary btn-sm theme-toggle" id="themeToggle" type="button">
          <span id="themeIcon" aria-hidden="true">☾</span>
          <span id="themeLabel">Tema oscuro</span>
        </button>
      </div>
    </div>
  </nav>

  <main class="auth-section">
    <div class="container">
      <section class="auth-card auth-card--compact shadow-sm p-4 p-md-5" aria-labelledby="loginTitle">
        <div class="text-center mb-4">
          <span class="auth-icon mb-3" aria-hidden="true">◎</span>
          <h1 class="h2 section-heading" id="loginTitle">Bienvenido de nuevo</h1>
          <p class="text-body-secondary mb-0">Ingresa tus datos para continuar.</p>
        </div>

        <!-- Formulario visual: el botón no ejecuta autenticación. -->
        <form>
          <div class="mb-3">
            <label class="form-label" for="loginEmail">Correo electrónico</label>
            <input class="form-control form-control-lg" type="email" id="loginEmail" name="email" autocomplete="username" placeholder="nombre@correo.com">
          </div>
          <div class="mb-3">
            <label class="form-label" for="loginPassword">Contraseña</label>
            <input class="form-control form-control-lg" type="password" id="loginPassword" name="password" autocomplete="current-password" placeholder="Tu contraseña">
          </div>
          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="rememberMe">
              <label class="form-check-label small" for="rememberMe">Recordarme</label>
            </div>
            <a class="small" href="#">¿Olvidaste tu contraseña?</a>
          </div>
          <div class="d-grid">
            <button class="btn btn-primary btn-lg" type="button">Iniciar sesión</button>
          </div>
        </form>

        <p class="text-center text-body-secondary small mt-4 mb-0">
          ¿Todavía no tienes una cuenta? <a href="registro.html" class="fw-semibold">Regístrate</a>
        </p>
      </section>
    </div>
  </main>

  <footer class="site-footer py-3">
    <div class="container text-center small text-body-secondary">© 2026 Nova Market</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/theme.js"></script>
</body>
</html>
